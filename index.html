<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>⚽ OddsAlert Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/identicon/svg?seed=⚽&backgroundColor=e94560" />
  <style>
    :root {
      --bg: #0a0a14; --card: #141428; --text: #e6e6f2; --text-muted: #8888aa;
      --accent: #e94560; --success: #00d9a5; --warn: #ffc107; --danger: #ff4757;
      --radius: 16px; --shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    [data-theme="light"] { --bg:#f4f4f9; --card:#fff; --text:#1a1a2e; --text-muted:#555; --shadow:0 6px 20px rgba(0,0,0,0.1); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; }
    header { background:var(--card); padding:1rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; box-shadow:var(--shadow); }
    h1 { font-size:1.2rem; display:flex; align-items:center; gap:0.4rem; }
    .btn { background:var(--accent); color:#fff; border:none; padding:0.5rem 0.8rem; border-radius:10px; font-weight:600; cursor:pointer; }
    .btn:active { transform:scale(0.95); }
    .status { font-size:0.8rem; color:var(--text-muted); padding:0.5rem 1rem; display:flex; justify-content:space-between; }
    .container { padding:1rem; }
    .match { background:var(--card); border-radius:var(--radius); padding:0.9rem; margin-bottom:0.8rem; box-shadow:var(--shadow); border-left:4px solid transparent; transition:0.2s; }
    .match.alert { border-left-color:var(--accent); background:rgba(233,69,96,0.08); }
    .match.critical { border-left-color:var(--danger); animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,0.4)} 50%{box-shadow:0 0 0 8px transparent} }
    .teams { display:flex; justify-content:space-between; align-items:center; margin:0.5rem 0; }
    .team { text-align:center; flex:1; font-weight:600; }
    .score { font-size:1.4rem; font-weight:800; padding:0 0.8rem; }
    .live { color:var(--danger); font-weight:700; }
    .odds { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.4rem; margin-top:0.6rem; }
    .odd { background:rgba(255,255,255,0.05); padding:0.4rem; border-radius:10px; text-align:center; }
    .odd-label { font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; }
    .odd-val { font-weight:700; font-size:0.95rem; }
    .odd-drop { color:var(--danger); }
    .odd-rise { color:var(--success); }
    .alert-box { margin-top:0.6rem; padding:0.5rem; background:rgba(255,193,7,0.1); border-radius:10px; font-size:0.8rem; display:none; }
    .alert-box.show { display:block; }
    .fab { position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:1.5rem; box-shadow:var(--shadow); cursor:pointer; z-index:20; }
    .fab.muted { opacity:0.5; }
    .empty { text-align:center; padding:3rem 1rem; color:var(--text-muted); }
    .install-banner { position:fixed; bottom:80px; left:1rem; right:1rem; background:var(--card); padding:0.8rem; border-radius:12px; display:none; justify-content:space-between; align-items:center; box-shadow:var(--shadow); }
    .install-banner.show { display:flex; }
  </style>
</head>
<body>
  <header>
    <h1>⚽ OddsAlert Pro</h1>
    <div style="display:flex;gap:0.4rem">
      <button class="btn" id="refresh">🔄</button>
      <button class="btn" id="theme">🌙</button>
    </div>
  </header>
  <div class="status">
    <span id="statusText">🟢 Povezano</span>
    <span id="timer">Sledeći refresh: --:--</span>
  </div>
  <div class="container" id="list">
    <div class="empty">⏳ Učitavanje utakmica...</div>
  </div>
  <button class="fab" id="soundToggle">🔊</button>
  <div class="install-banner" id="installBanner">
    <span>📱 Instaliraj kao aplikaciju</span>
    <button class="btn" id="installBtn">Instaliraj</button>
  </div>

  <script>
    // 🔑 KONFIGURACIJA
    const API_KEYS = ['8464fe0b2c02cc648155fd7aaa8a5806', 'f1cce1e4be71307c45a7a206e4a16495'];
    const ODDS_KEY = '0fe3d301aa11cda024d49acef8511f22';
    let keyIdx = 0, soundOn = true, matches = {}, initialOdds = {}, lastCheck = 0;
    const REFRESH_MIN = 3, REFRESH_MAX = 4;
    const FAV_ODDS_LIMIT = 1.75;
    const DROP_THRESHOLD = 0.10; // 10%

    // 🎵 ZVUK (Web Audio API - nema potrebe za eksternim fajlovima)
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq=800, dur=0.4) {
      if(!soundOn) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      o.start(); o.stop(ctx.currentTime + dur);
    }

    // 🌐 POMOĆNE FUNKCIJE
    const $ = id => document.getElementById(id);
    const now = () => new Date();
    const pad = n => n.toString().padStart(2,'0');
    const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const getNextRefresh = () => Math.floor(Math.random() * (REFRESH_MAX-REFRESH_MIN+1) + REFRESH_MIN) * 60000;
    let nextRefreshAt = now().getTime() + getNextRefresh();

    async function fetchWithRetry(url, headers={}) {
      for(let i=0; i<API_KEYS.length; i++) {
        const idx = (keyIdx + i) % API_KEYS.length;
        const res = await fetch(url, { headers: { ...headers, 'x-apisports-key': API_KEYS[idx] } });
        if(res.status === 429) continue;
        keyIdx = idx;
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }
      throw new Error('API limit reached');
    }

    function getOddsFromApi(matchId) {
      // The Odds API zahteva specifičan format. Koristićemo placeholder endpoint koji radi sa ključem.
      // Za pravi rad, zameni URL sa zvaničnim endpointom npr: https://api.the-odds-api.com/v4/sports/soccer_epl/odds/?apiKey=${ODDS_KEY}
      return Promise.resolve(null); // Placeholder - u proizvodnji se zamenjuje pravim fetch-om
    }

    function calcDrop(initial, current) {
      if(!initial || !current) return 0;
      return ((initial - current) / initial) * 100;
    }

    function showAlert(match, type, msg) {
      const box = document.querySelector(`[data-match="${match.id}"] .alert-box`);
      if(box) { box.textContent = msg; box.classList.add('show'); }
      beep(type==='critical'?400:800);
      if('Notification' in window && Notification.permission==='granted') {
        new Notification('⚽ OddsAlert', { body: msg, tag: match.id });
      }
    }

    function renderMatches(data) {
      const list = $('list');
      list.innerHTML = '';
      if(!data?.response?.length) { list.innerHTML = '<div class="empty">📭 Nema utakmica za danas</div>'; return; }

      data.response.forEach(m => {
        const isLive = m.fixture.status.short === '1H' || m.fixture.status.short === '2H' || m.fixture.status.short === 'HT';
        const fav = m.odds?.find(o => o < FAV_ODDS_LIMIT);
        const isFavMatch = !!fav;
        const initial = initialOdds[m.fixture.id] || fav;
        if(isFavMatch && !initialOdds[m.fixture.id]) initialOdds[m.fixture.id] = fav;

        const div = document.createElement('div');
        div.className = `match ${isFavMatch?'':' '} ${isLive?'':''}`;
        div.dataset.match = m.fixture.id;
        div.innerHTML = `
          <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.3rem">${m.league.name} • ${fmtTime(new Date(m.fixture.date))}</div>
          <div class="teams">
            <div class="team">${m.teams.home.name}</div>
            <div class="score ${isLive?'live':''}">${m.goals.home} - ${m.goals.away} ${isLive?`<br><small>${m.fixture.status.elapsed}'</small>`:''}</div>
            <div class="team">${m.teams.away.name}</div>
          </div>
          <div class="odds">
            <div class="odd"><div class="odd-label">1</div><div class="odd-val" id="o1-${m.fixture.id}">${m.odds?.[0]||'-'}</div><div style="font-size:0.6rem;color:var(--text-muted)">init: ${initialOdds[m.fixture.id]?.[0]||'-'}</div></div>
            <div class="odd"><div class="odd-label">X</div><div class="odd-val" id="oX-${m.fixture.id}">${m.odds?.[1]||'-'}</div></div>
            <div class="odd"><div class="odd-label">2</div><div class="odd-val" id="o2-${m.fixture.id}">${m.odds?.[2]||'-'}</div></div>
          </div>
          <div class="alert-box"></div>
        `;
        list.appendChild(div);

        // 🚨 LOGIKA ALERTA
        if(isFavMatch) {
          const elapsed = m.fixture.status.elapsed || 0;
          const goalsHome = m.goals.home, goalsAway = m.goals.away;
          const favIsHome = initial < (initialOdds[m.fixture.id]?.[2] || 99);
          const favLosing = favIsHome ? goalsHome < goalsAway : goalsAway < goalsHome;
          const draw75 = elapsed >= 75 && goalsHome === goalsAway;
          const drop = calcDrop(initial, fav);

          if(favLosing) {
            div.classList.add('alert');
            showAlert(m, 'alert', `⚠️ Favorit gubi! Početna: ${initial} → Live: ${favLosing?'gubi':''}`);
          }
          if(draw75) {
            div.classList.add('critical');
            showAlert(m, 'critical', `🟡 Nerešeno u ${elapsed}'. Favorit koči!`);
          }
          if(drop > DROP_THRESHOLD * 100) {
            div.classList.add('alert');
            showAlert(m, 'alert', `📉 Kvota pala ${drop.toFixed(1)}%! Init: ${initial} → Live: ${fav}`);
          }
        }
      });
    }

    async function loadData() {
      $('statusText').textContent = '🔄 Osvežavanje...';
      try {
        const date = now().toISOString().split('T')[0];
        const fixtures = await fetchWithRetry(`https://v3.football.api-sports.io/fixtures?date=${date}`);
        // Simulacija kvota (u produkciji pozovi The Odds API)
        fixtures.response.forEach(m => {
          if(!m.odds) m.odds = [1.80, 3.40, 4.20]; // fallback
        });
        renderMatches(fixtures);
        lastCheck = now().getTime();
        $('statusText').textContent = `✅ Ažurirano: ${fmtTime(now())}`;
      } catch(e) {
        $('statusText').textContent = '❌ Greška pri učitavanju';
        console.error(e);
      }
      scheduleNext();
    }

    function scheduleNext() {
      nextRefreshAt = now().getTime() + getNextRefresh();
      const updateTimer = () => {
        const diff = Math.max(0, Math.floor((nextRefreshAt - now().getTime())/1000));
        $('timer').textContent = `Sledeći refresh: ${pad(Math.floor(diff/60))}:${pad(diff%60)}`;
        if(diff<=0) loadData();
        else requestAnimationFrame(updateTimer);
      };
      updateTimer();
    }

    // 🔔 PODEŠAVANJA
    $('refresh').onclick = loadData;
    $('theme').onclick = () => document.body.dataset.theme = document.body.dataset.theme==='light'?'':'light';
    $('soundToggle').onclick = function() { soundOn = !soundOn; this.textContent = soundOn?'🔊':'🔇'; this.classList.toggle('muted',!soundOn); };
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();

    // 📲 PWA
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      $('installBanner').classList.add('show');
      $('installBtn').onclick = () => { e.prompt(); $('installBanner').classList.remove('show'); };
    });
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    // 🕐 SNAPSHOT 13h & 17h
    setInterval(() => {
      const h = now().getHours();
      if((h===13 || h===17) && now().getMinutes()===0 && lastCheck < now().getTime()-60000) {
        const snapshot = { time: fmtTime(now()), matches: Object.values(matches) };
        localStorage.setItem(`snapshot_${h}`, JSON.stringify(snapshot));
        beep(600, 0.6);
        new Notification('📸 Snapshot', { body: `Sačuvan izveštaj za ${h}:00h.`, tag:`snap${h}` });
      }
    }, 60000);

    loadData();
  </script>
</body>
</html>
