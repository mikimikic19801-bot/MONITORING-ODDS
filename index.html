<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pratite utakmice i kvote u realnom vremenu sa obaveštenjima">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Odds Monitor">
    
    <title>Odds Monitor - Pratite Kvote & Rezultate</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a2e' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='%2300d4ff' text-anchor='middle' dy='.3em' font-weight='bold'>⚽</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a1a2e' width='180' height='180'/><text x='50%' y='50%' font-size='100' fill='%2300d4ff' text-anchor='middle' dy='.3em' font-weight='bold'>⚽</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00d4ff; --primary-dark: #0099cc; --secondary: #ff006e;
            --success: #00d084; --warning: #ffa700; --danger: #ff0054;
            --dark: #1a1a2e; --darker: #0f3460; --light: #e0e0e0;
            --card-bg: #16213e; --border-color: #2a3f5f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--light); overflow-x: hidden; min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(255,0,110,0.1));
            border-bottom: 2px solid var(--primary); padding: 15px 20px; position: sticky; top: 0; z-index:1000;
            box-shadow: 0 4px 20px rgba(0,212,255,0.2);
        }
        .header-content { max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:20px; }
        .logo { font-size:24px; font-weight:900; color:var(--primary); text-transform:uppercase; letter-spacing:2px; display:flex; align-items:center; gap:10px; }
        .logo-emoji { font-size:28px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .header-controls { display:flex; gap:15px; align-items:center; }
        .refresh-btn, .settings-btn {
            background:var(--primary); border:none; color:var(--dark); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; transition:all .3s; font-size:14px;
        }
        .refresh-btn:hover, .settings-btn:hover { background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,212,255,.3); }
        .refresh-btn.loading { animation: spin 1s linear infinite; }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .container { max-width:1400px; margin:0 auto; padding:20px; }

        .stats-section { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-bottom:30px; }
        .stat-card { background:var(--card-bg); border:2px solid var(--border-color); border-radius:12px; padding:20px; text-align:center; transition:all .3s; }
        .stat-card:hover { border-color:var(--primary); box-shadow:0 4px 15px rgba(0,212,255,.2); }
        .stat-label { color:var(--light); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; opacity:.7; }
        .stat-value { font-size:32px; font-weight:900; color:var(--primary); }
        .stat-subtext { font-size:12px; color:var(--light); margin-top:5px; opacity:.6; }

        .filter-section { background:var(--card-bg); border:2px solid var(--border-color); border-radius:12px; padding:20px; margin-bottom:30px; display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
        .filter-group { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .filter-label { font-size:12px; text-transform:uppercase; color:var(--light); opacity:.7; letter-spacing:1px; }

        .matches-section { margin-bottom:30px; }
        .section-title { font-size:20px; font-weight:900; color:var(--primary); margin-bottom:20px; text-transform:uppercase; letter-spacing:2px; padding-bottom:10px; border-bottom:3px solid var(--primary); }
        .matches-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:20px; }

        .match-card { background:linear-gradient(135deg,var(--card-bg) 0%, rgba(22,33,62,.8) 100%); border:2px solid var(--border-color); border-radius:12px; overflow:hidden; transition:all .3s; position:relative; }
        .match-card:hover { border-color:var(--primary); box-shadow:0 8px 25px rgba(0,212,255,.2); transform:translateY(-5px); }
        .match-card.favorite { border-color:var(--secondary); box-shadow:0 0 20px rgba(255,0,110,.3); }
        .match-card.losing { border-color:var(--danger); background:linear-gradient(135deg, rgba(255,0,84,.1) 0%, rgba(22,33,62,.8) 100%); animation:alert-pulse 1s infinite; }
        @keyframes alert-pulse { 0%,100%{box-shadow:0 0 10px rgba(255,0,84,.2);} 50%{box-shadow:0 0 20px rgba(255,0,84,.4);} }

        .match-status { position:absolute; top:10px; right:10px; background:var(--primary); color:var(--dark); padding:5px 12px; border-radius:20px; font-size:11px; font-weight:900; text-transform:uppercase; z-index:10; }
        .match-status.live { background:var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:.6;} }
        .match-status.scheduled { background:var(--warning); }
        .match-status.finished { background:var(--light); color:var(--dark); }

        .match-header { background:linear-gradient(135deg, rgba(0,212,255,.1), rgba(255,0,110,.1)); padding:15px; border-bottom:2px solid var(--border-color); }
        .match-time { font-size:12px; color:var(--primary); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
        .match-league { font-size:11px; color:var(--light); opacity:.7; text-transform:uppercase; }

        .match-body { padding:20px; }
        .match-teams { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; }
        .team { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .team-logo { width:50px; height:50px; background:var(--border-color); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; border:2px solid var(--border-color); }
        .team-name { font-size:13px; font-weight:700; text-align:center; color:var(--light); word-break:break-word; }
        .team.favorite .team-name { color:var(--secondary); font-weight:900; }
        .vs { font-size:11px; color:var(--primary); font-weight:900; text-transform:uppercase; padding:0 5px; }

        .match-score { background:linear-gradient(135deg, rgba(0,212,255,.1), rgba(0,212,255,.05)); border:2px solid var(--border-color); border-radius:8px; padding:15px; margin-bottom:15px; text-align:center; }
        .score-display { font-size:32px; font-weight:900; color:var(--primary); margin-bottom:5px; }
        .score-time { font-size:12px; color:var(--light); opacity:.7; }

        .initial-odds { background:var(--darker); border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:15px; font-size:12px; }
        .initial-odds-label { color:var(--light); opacity:.6; margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px; }
        .initial-odds-value { color:var(--primary); font-weight:900; font-size:16px; }

        .odds-section { border-top:2px solid var(--border-color); padding-top:15px; margin-bottom:15px; }
        .odds-label { font-size:11px; color:var(--light); opacity:.6; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
        .odds-display { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .odd-box { background:var(--darker); border:2px solid var(--border-color); border-radius:8px; padding:10px; text-align:center; transition:all .3s; }
        .odd-label { font-size:10px; color:var(--light); opacity:.6; margin-bottom:3px; }
        .odd-value { font-size:18px; font-weight:900; color:var(--primary); }
        .odd-change { font-size:10px; margin-top:3px; padding:2px 5px; border-radius:4px; }
        .odd-change.down { background:rgba(255,0,84,.2); color:var(--danger); }
        .odd-change.up { background:rgba(0,208,132,.2); color:var(--success); }

        .alerts-container { position:fixed; top:80px; right:20px; z-index:999; max-width:400px; }
        .alert { background:var(--card-bg); border-left:4px solid var(--primary); border-radius:8px; padding:15px; margin-bottom:10px; animation:slideIn .3s ease; box-shadow:0 4px 15px rgba(0,212,255,.2); display:flex; gap:10px; }
        .alert.danger { border-left-color:var(--danger); }
        .alert.warning { border-left-color:var(--warning); }
        .alert.success { border-left-color:var(--success); }
        @keyframes slideIn { from{transform:translateX(400px); opacity:0;} to{transform:translateX(0); opacity:1;} }
        .alert-icon { font-size:20px; flex-shrink:0; }
        .alert-content { flex:1; }
        .alert-title { font-weight:700; margin-bottom:3px; font-size:13px; }
        .alert-message { font-size:12px; opacity:.8; }
        .alert-close { background:none; border:none; color:var(--light); cursor:pointer; font-size:18px; opacity:.6; transition:opacity .2s; }
        .alert-close:hover { opacity:1; }

        .loading { display:flex; justify-content:center; align-items:center; min-height:400px; gap:15px; }
        .spinner { width:40px; height:40px; border:4px solid rgba(0,212,255,.2); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }

        .empty-state { text-align:center; padding:60px 20px; color:var(--light); opacity:.6; }
        .empty-state-icon { font-size:48px; margin-bottom:15px; }
        .empty-state-text { font-size:16px; margin-bottom:10px; }

        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.8); z-index:2000; align-items:center; justify-content:center; }
        .modal.active { display:flex; animation:fadeIn .3s ease; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal-content { background:var(--card-bg); border:2px solid var(--primary); border-radius:12px; padding:30px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; }
        .modal-title { font-size:20px; font-weight:900; color:var(--primary); margin-bottom:20px; text-transform:uppercase; letter-spacing:2px; }
        .setting-group { margin-bottom:20px; }
        .setting-label { font-size:12px; color:var(--light); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:block; }
        input[type="text"], input[type="number"] { width:100%; background:var(--darker); border:2px solid var(--border-color); border-radius:8px; padding:10px; color:var(--light); font-size:14px; transition:border-color .3s; }
        input[type="text"]:focus, input[type="number"]:focus { outline:none; border-color:var(--primary); }
        .modal-buttons { display:flex; gap:10px; margin-top:25px; }
        .btn { flex:1; padding:12px; border:none; border-radius:8px; font-weight:600; cursor:pointer; transition:all .3s; text-transform:uppercase; letter-spacing:1px; font-size:12px; }
        .btn-primary { background:var(--primary); color:var(--dark); }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-secondary { background:var(--darker); color:var(--light); border:2px solid var(--border-color); }
        .btn-secondary:hover { border-color:var(--primary); }

        .time-indicator { display:inline-block; background:var(--warning); color:var(--dark); padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; margin-left:8px; }

        @media (max-width:768px) {
            .header-content{flex-direction:column;gap:10px;}
            .matches-grid{grid-template-columns:1fr;}
            .stats-section{grid-template-columns:repeat(2,1fr);}
            .alerts-container{left:10px;right:10px;max-width:none;}
            .filter-section{flex-direction:column;align-items:flex-start;}
            .logo{font-size:18px;}
            .stat-value{font-size:24px;}
        }
        @media (max-width:480px) {
            .container{padding:10px;}
            .stats-section{grid-template-columns:1fr;}
            .match-card{border-radius:8px;}
            .match-body{padding:15px;}
            .refresh-btn, .settings-btn{padding:6px 12px; font-size:12px;}
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-emoji">⚽</span>
                <span>Odds Monitor</span>
            </div>
            <div class="header-controls">
                <button class="refresh-btn" id="refreshBtn">🔄 Osvezi</button>
                <button class="settings-btn" id="settingsBtn">⚙️ Postavke</button>
            </div>
        </div>
    </header>

    <div class="alerts-container" id="alertsContainer"></div>

    <div class="container">
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Aktivnih Mečeva</div>
                <div class="stat-value" id="liveMatchesCount">0</div>
                <div class="stat-subtext">U toku</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Praćenih Meča</div>
                <div class="stat-value" id="favoriteMatchesCount">0</div>
                <div class="stat-subtext">Favoriti</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Kvota Pad Alerta</div>
                <div class="stat-value" id="oddsDropCount">0</div>
                <div class="stat-subtext">Detektovano</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Gubitak Favorita</div>
                <div class="stat-value" id="losingCount">0</div>
                <div class="stat-subtext">Alerta</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label class="filter-label">
                    <input type="checkbox" id="showLiveOnly" checked> Samo Aktivni Mečevi
                </label>
            </div>
            <div class="filter-group">
                <label class="filter-label">
                    <input type="checkbox" id="showFavoritesOnly"> Samo Favoriti
                </label>
            </div>
            <div class="filter-group">
                <label class="filter-label">
                    <input type="checkbox" id="enableNotifications" checked> Obaveštenja
                </label>
            </div>
            <div class="filter-group">
                <label class="filter-label">
                    <input type="checkbox" id="enableSound" checked> Zvuk
                </label>
            </div>
        </div>

        <div class="matches-section">
            <h2 class="section-title">⚡ Aktivni Mečevi</h2>
            <div class="matches-grid" id="liveMatchesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Učitavanje...</div>
                </div>
            </div>
        </div>

        <div class="matches-section">
            <h2 class="section-title">📅 Zakazani Mečevi</h2>
            <div class="matches-grid" id="scheduledMatchesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <div class="empty-state-text">Učitavanje zakazanih mečeva...</div>
                </div>
            </div>
        </div>

        <div class="matches-section">
            <h2 class="section-title">✅ Završeni Mečevi</h2>
            <div class="matches-grid" id="finishedMatchesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <div class="empty-state-text">Učitavanje završenih mečeva...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 class="modal-title">Postavke Aplikacije</h2>
            
            <div class="setting-group">
                <label class="setting-label">API Ključ - API Football (Broj 1)</label>
                <input type="text" id="apiKey1" placeholder="8464fe0b2c02cc648155fd7aaa8a5806">
            </div>

            <div class="setting-group">
                <label class="setting-label">API Ključ - API Football (Broj 2)</label>
                <input type="text" id="apiKey2" placeholder="f1cce1e4be71307c45a7a206e4a16495">
            </div>

            <div class="setting-group">
                <label class="setting-label">API Ključ - The Odds API</label>
                <input type="text" id="apiKeyOdds" placeholder="0fe3d301aa11cda024d49acef8511f22">
            </div>

            <div class="setting-group">
                <label class="setting-label">Minimalna Kvota za Praćenje</label>
                <input type="number" id="minOdds" placeholder="1.75" min="1" max="10" step="0.01">
            </div>

            <div class="setting-group">
                <label class="setting-label">Prag Pada Kvote (%)</label>
                <input type="number" id="oddDropThreshold" placeholder="10" min="1" max="50" step="1">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-primary" id="savSettingsBtn">Sačuvaj</button>
                <button class="btn btn-secondary" id="closeSettingsBtn">Zatvori</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // KONFIGURACIJA I KONSTANTE (SA TVOJIM KLJUČEVIMA)
        // ========================================
        const CONFIG = {
            API_FOOTBALL_1: '8464fe0b2c02cc648155fd7aaa8a5806',
            API_FOOTBALL_2: 'f1cce1e4be71307c45a7a206e4a16495',
            API_ODDS: '0fe3d301aa11cda024d49acef8511f22',
            MIN_ODDS_TO_TRACK: 1.75,
            ODDS_DROP_THRESHOLD: 10,
            REFRESH_INTERVAL: 3.5 * 60 * 1000, // 3.5 minuta
            ODDS_CHECK_INTERVAL: 3.5 * 60 * 1000,
            ODDS_CHECK_TIMES: ['13:00', '17:00'],
        };

        // ========================================
        // STATE
        // ========================================
        const STATE = {
            matches: [],
            favoriteMatches: new Set(),
            matchOddsHistory: new Map(),
            previousOdds: new Map(),
            totalOddsDropAlerts: 0,
            totalLosingAlerts: 0,
            lastOddsCheck: null,
            lastRefresh: null,
        };

        // ========================================
        // UTIL
        // ========================================
        const Utils = {
            getStorageItem: (key, defaultValue = null) => {
                try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultValue; } catch (e) { return defaultValue; }
            },
            setStorageItem: (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('Storage error:', e); }
            },
            playSound: (type = 'alert') => {
                if (!document.getElementById('enableSound').checked) return;
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode); gainNode.connect(audioContext.destination);
                    if (type === 'alert') {
                        oscillator.frequency.value = 800;
                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        oscillator.start(audioContext.currentTime); oscillator.stop(audioContext.currentTime + 0.5);
                    } else if (type === 'success') {
                        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                        oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.start(audioContext.currentTime); oscillator.stop(audioContext.currentTime + 0.3);
                    } else if (type === 'danger') {
                        oscillator.frequency.value = 600;
                        gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                        oscillator.start(audioContext.currentTime); oscillator.stop(audioContext.currentTime + 0.8);
                    }
                } catch (e) {
                    console.warn('Zvuk nije podržan:', e);
                }
            },
            formatTime: (timestamp) => { if (!timestamp) return 'N/A'; const date = new Date(timestamp); return date.toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' }); },
            formatDate: (timestamp) => { if (!timestamp) return 'N/A'; const date = new Date(timestamp); return date.toLocaleDateString('sr-RS', { month: 'short', day: 'numeric' }); },
            getStatusBadge: (fixture) => {
                if (!fixture) return { text: 'N/A', class: 'scheduled' };
                if (fixture.status === 'LIVE') return { text: '🔴 UŽIVO', class: 'live' };
                if (fixture.status === 'FINISHED' || fixture.status === 'FT') return { text: '✅ ZAVRŠENO', class: 'finished' };
                return { text: '⏳ ZAKAZANO', class: 'scheduled' };
            },
            calculateTimeRemaining: (timestamp) => {
                const now = new Date(); const kickoff = new Date(timestamp); const diff = kickoff - now;
                if (diff < 0) return null;
                const hours = Math.floor(diff / (1000*60*60));
                const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
                if (hours > 0) return `${hours}h ${minutes}m`; return `${minutes}m`;
            },
            isTimeInRange: (checkTime) => {
                const now = new Date();
                const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                return currentTime === checkTime;
            },
            sendNotification: (title, options = {}) => {
                if (!document.getElementById('enableNotifications').checked) return;
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification(title, { icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect fill="%231a1a2e" width="192" height="192"/><text x="50%" y="50%" font-size="120" fill="%2300d4ff" text-anchor="middle" dy=".3em" font-weight="bold">⚽</text></svg>', badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect fill="%231a1a2e" width="96" height="96"/><text x="50%" y="50%" font-size="60" fill="%2300d4ff" text-anchor="middle" dy=".3em" font-weight="bold">⚽</text></svg>', tag: 'odds-monitor-notification', requireInteraction: true, ...options });
                }
            },
        };

        // ========================================
        // API FUNKCIJE
        // ========================================
        const API = {
            fetchLiveMatches: async () => {
                try {
                    const apiKey = document.getElementById('apiKey1').value || CONFIG.API_FOOTBALL_1;
                    const response = await fetch('https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all', {
                        headers: { 'x-rapidapi-host': 'api-football-v1.p.rapidapi.com', 'x-rapidapi-key': apiKey }
                    });
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    const data = await response.json();
                    return data.response || [];
                } catch (error) {
                    console.error('Error fetching live matches:', error);
                    UI.showAlert('Greška pri učitavanju mečeva', String(error), 'danger');
                    return [];
                }
            },

            fetchScheduledMatches: async (leagueId = 39) => {
                try {
                    const apiKey = document.getElementById('apiKey2').value || CONFIG.API_FOOTBALL_2;
                    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
                    const dateStr = tomorrow.toISOString().split('T')[0];
                    const response = await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?date=${dateStr}&league=${leagueId}&season=2024`, {
                        headers: { 'x-rapidapi-host': 'api-football-v1.p.rapidapi.com', 'x-rapidapi-key': apiKey }
                    });
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    const data = await response.json();
                    return data.response || [];
                } catch (error) {
                    console.error('Error fetching scheduled matches:', error);
                    return [];
                }
            },

            fetchOdds: async (matchId) => {
                try {
                    const apiKey = document.getElementById('apiKeyOdds').value || CONFIG.API_ODDS;
                    // The Odds API uses event IDs that may not match API-Football IDs.
                    // Here we attempt a generic call; you may need to map fixtures to odds events.
                    const response = await fetch(`https://api.the-odds-api.com/v4/sports/soccer/events/${matchId}/odds?apiKey=${apiKey}&regions=eu&markets=h2h,spreads`);
                    if (!response.ok) throw new Error(`Odds API Error: ${response.status}`);
                    const data = await response.json();
                    return data || [];
                } catch (error) {
                    console.error('Error fetching odds:', error);
                    return [];
                }
            },

            fetchFinishedMatches: async (leagueId = 39) => {
                try {
                    const apiKey = document.getElementById('apiKey1').value || CONFIG.API_FOOTBALL_1;
                    const today = new Date(); today.setDate(today.getDate() - 1);
                    const dateStr = today.toISOString().split('T')[0];
                    const response = await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?date=${dateStr}&league=${leagueId}&season=2024`, {
                        headers: { 'x-rapidapi-host': 'api-football-v1.p.rapidapi.com', 'x-rapidapi-key': apiKey }
                    });
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    const data = await response.json();
                    return (data.response || []).filter(m => m.fixture && (m.fixture.status === 'FT' || m.fixture.status === 'FINISHED')) || [];
                } catch (error) {
                    console.error('Error fetching finished matches:', error);
                    return [];
                }
            },
        };

        // ========================================
        // UI FUNKCIJE
        // ========================================
        const UI = {
            showAlert: (title, message, type = 'info') => {
                const container = document.getElementById('alertsContainer');
                const alert = document.createElement('div');
                alert.className = `alert ${type}`;
                const iconMap = { info: '🔵', warning: '🟡', danger: '🔴', success: '🟢' };
                alert.innerHTML = `<div class="alert-icon">${iconMap[type] || 'ℹ️'}</div>
                    <div class="alert-content"><div class="alert-title">${title}</div><div class="alert-message">${message}</div></div>
                    <button class="alert-close">✕</button>`;
                alert.querySelector('.alert-close').addEventListener('click', () => { alert.remove(); });
                container.appendChild(alert);
                setTimeout(() => { if (alert.parentNode) alert.remove(); }, 8000);
            },

            updateStats: () => {
                const liveMatches = STATE.matches.filter(m => m.fixture && (m.fixture.status === 'LIVE' || m.fixture.status === '1H' || m.fixture.status === '2H'));
                const favorites = Array.from(STATE.favoriteMatches);
                document.getElementById('liveMatchesCount').textContent = liveMatches.length;
                document.getElementById('favoriteMatchesCount').textContent = favorites.length;
                document.getElementById('oddsDropCount').textContent = STATE.totalOddsDropAlerts;
                document.getElementById('losingCount').textContent = STATE.totalLosingAlerts;
            },

            renderMatch: (match) => {
                const fixture = match.fixture || {};
                const goals = match.goals || { home: 0, away: 0 };
                const teams = match.teams || { home: {name:'Home'}, away:{name:'Away'} };
                const matchId = fixture.id ? fixture.id.toString() : (match.id ? match.id.toString() : Math.random().toString(36).slice(2));
                const isFavorite = STATE.favoriteMatches.has(matchId);
                const status = Utils.getStatusBadge(fixture);
                const oddsHistory = STATE.matchOddsHistory.get(matchId) || [];
                const initialOdds = oddsHistory.length ? oddsHistory[0].odds : 'N/A';
                const liveOdds = oddsHistory.length ? oddsHistory[oddsHistory.length-1].odds : 'N/A';
                let oddsChangePercent = 'N/A';
                if (initialOdds !== 'N/A' && liveOdds !== 'N/A' && initialOdds > 0) {
                    oddsChangePercent = (((liveOdds - initialOdds)/initialOdds)*100).toFixed(1);
                }
                const isLosing = isFavorite && fixture.status && fixture.status.toUpperCase().includes('LIVE') && goals.home < goals.away;
                const timeRemaining = fixture.status === 'SCHEDULED' ? Utils.calculateTimeRemaining(fixture.date) : null;

                return `
                <div class="match-card ${isFavorite ? 'favorite' : ''} ${isLosing ? 'losing' : ''}">
                    <div class="match-status ${status.class}">${status.text}</div>
                    <div class="match-header">
                        <div class="match-time">${Utils.formatDate(fixture.date)} | ${Utils.formatTime(fixture.date)}</div>
                        <div class="match-league">${match.league ? match.league.name : 'Liga'}</div>
                    </div>
                    <div class="match-body">
                        <div class="match-teams">
                            <div class="team ${isFavorite ? 'favorite' : ''}">
                                <div class="team-logo">${teams.home.name ? teams.home.name.charAt(0).toUpperCase() : 'H'}</div>
                                <div class="team-name">${teams.home.name}</div>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <div class="team-logo">${teams.away.name ? teams.away.name.charAt(0).toUpperCase() : 'A'}</div>
                                <div class="team-name">${teams.away.name}</div>
                            </div>
                        </div>

                        ${fixture.status && fixture.status.toUpperCase().includes('LIVE') ? `
                            <div class="match-score">
                                <div class="score-display">${goals.home} - ${goals.away}</div>
                                <div class="score-time">${fixture.status_short || ''} (${fixture.elapsed || 0}')</div>
                            </div>
                        ` : fixture.status && (fixture.status === 'FT' || fixture.status === 'FINISHED') ? `
                            <div class="match-score">
                                <div class="score-display">${goals.home} - ${goals.away}</div>
                                <div class="score-time">ZAVRŠENO</div>
                            </div>
                        ` : `
                            <div class="match-score">
                                <div class="score-display">-</div>
                                <div class="score-time">${timeRemaining ? timeRemaining + ' do početka' : 'N/A'}</div>
                            </div>
                        `}

                        ${isFavorite ? `
                            <div class="initial-odds">
                                <div class="initial-odds-label">Početna Kvota (Favorit)</div>
                                <div class="initial-odds-value">${initialOdds === 'N/A' ? 'N/A' : parseFloat(initialOdds).toFixed(2)}</div>
                            </div>
                        ` : ''}

                        <div class="odds-section">
                            <div class="odds-label">📊 KVOTE (Favorit / Trenutna)</div>
                            <div class="odds-display">
                                <div class="odd-box">
                                    <div class="odd-label">Favorit</div>
                                    <div class="odd-value">${liveOdds === 'N/A' ? 'N/A' : parseFloat(liveOdds).toFixed(2)}</div>
                                    ${oddsChangePercent !== 'N/A' ? `<div class="odd-change ${parseFloat(oddsChangePercent) < 0 ? 'down' : 'up'}">${parseFloat(oddsChangePercent) < 0 ? '📉' : '📈'} ${Math.abs(oddsChangePercent)}%</div>` : ''}
                                </div>
                                <div class="odd-box">
                                    <div class="odd-label">Trenutna</div>
                                    <div class="odd-value">${liveOdds === 'N/A' ? 'N/A' : parseFloat(liveOdds).toFixed(2)}</div>
                                    ${isLosing ? '<div class="odd-change down">🚨 GUBITAK</div>' : ''}
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-primary" style="width:100%; margin-top:15px;" onclick="toggleFavorite('${matchId}')">
                            ${isFavorite ? '⭐ Ukloni iz Favorita' : '☆ Dodaj u Favorite'}
                        </button>
                    </div>
                </div>
                `;
            },

            renderMatches: () => {
                const liveMatches = STATE.matches.filter(m => m.fixture && (m.fixture.status === 'LIVE' || m.fixture.status === '1H' || m.fixture.status === '2H'));
                const scheduledMatches = STATE.matches.filter(m => m.fixture && (m.fixture.status === 'SCHEDULED' || !m.fixture.status)).slice(0,6);
                const finishedMatches = STATE.matches.filter(m => m.fixture && (m.fixture.status === 'FT' || m.fixture.status === 'FINISHED')).slice(0,6);

                const showLiveOnly = document.getElementById('showLiveOnly').checked;
                const showFavoritesOnly = document.getElementById('showFavoritesOnly').checked;

                const liveContainer = document.getElementById('liveMatchesContainer');
                if (showLiveOnly && liveMatches.length === 0) {
                    liveContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">😴</div><div class="empty-state-text">Nema aktivnih mečeva</div></div>';
                } else {
                    const filteredLive = showFavoritesOnly ? liveMatches.filter(m => STATE.favoriteMatches.has(m.fixture.id.toString())) : liveMatches;
                    liveContainer.innerHTML = filteredLive.length > 0 ? filteredLive.map(m => UI.renderMatch(m)).join('') : '<div class="empty-state"><div class="empty-state-icon">😴</div><div class="empty-state-text">Nema aktivnih mečeva</div></div>';
                }

                const scheduledContainer = document.getElementById('scheduledMatchesContainer');
                if (scheduledMatches.length === 0) {
                    scheduledContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Nema zakazanih mečeva</div></div>';
                } else {
                    const filteredScheduled = showFavoritesOnly ? scheduledMatches.filter(m => STATE.favoriteMatches.has(m.fixture.id.toString())) : scheduledMatches;
                    scheduledContainer.innerHTML = filteredScheduled.length > 0 ? filteredScheduled.map(m => UI.renderMatch(m)).join('') : '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Nema zakazanih mečeva</div></div>';
                }

                const finishedContainer = document.getElementById('finishedMatchesContainer');
                if (finishedMatches.length === 0) {
                    finishedContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">Nema završenih mečeva</div></div>';
                } else {
                    const filteredFinished = showFavoritesOnly ? finishedMatches.filter(m => STATE.favoriteMatches.has(m.fixture.id.toString())) : finishedMatches;
                    finishedContainer.innerHTML = filteredFinished.length > 0 ? filteredFinished.map(m => UI.renderMatch(m)).join('') : '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">Nema završenih mečeva</div></div>';
                }
            },

            loadSettings: () => {
                document.getElementById('apiKey1').value = Utils.getStorageItem('apiKey1', CONFIG.API_FOOTBALL_1);
                document.getElementById('apiKey2').value = Utils.getStorageItem('apiKey2', CONFIG.API_FOOTBALL_2);
                document.getElementById('apiKeyOdds').value = Utils.getStorageItem('apiKeyOdds', CONFIG.API_ODDS);
                document.getElementById('minOdds').value = Utils.getStorageItem('minOdds', CONFIG.MIN_ODDS_TO_TRACK);
                document.getElementById('oddDropThreshold').value = Utils.getStorageItem('oddDropThreshold', CONFIG.ODDS_DROP_THRESHOLD);
            },

            saveSettings: () => {
                Utils.setStorageItem('apiKey1', document.getElementById('apiKey1').value);
                Utils.setStorageItem('apiKey2', document.getElementById('apiKey2').value);
                Utils.setStorageItem('apiKeyOdds', document.getElementById('apiKeyOdds').value);
                Utils.setStorageItem('minOdds', parseFloat(document.getElementById('minOdds').value));
                Utils.setStorageItem('oddDropThreshold', parseInt(document.getElementById('oddDropThreshold').value));
                UI.showAlert('Postavke Sačuvane', 'Vaše postavke su uspešno sačuvane', 'success');
                Utils.playSound('success');
            },
        };

        // ========================================
        // MONITORING LOGIKA
        // ========================================
        const Monitor = {
            checkOddsDrops: async () => {
                if (!STATE.favoriteMatches.size) return;
                for (const matchId of STATE.favoriteMatches) {
                    const match = STATE.matches.find(m => (m.fixture && m.fixture.id && m.fixture.id.toString() === matchId) || (m.id && m.id.toString() === matchId));
                    if (!match || !(match.fixture && (match.fixture.status === 'LIVE' || (match.fixture.status && match.fixture.status.toUpperCase().includes('LIVE'))))) continue;
                    try {
                        const oddsData = await API.fetchOdds(matchId);
                        // oddsData format can vary — we try to extract a sensible "price"
                        const book = Array.isArray(oddsData) && oddsData.length ? oddsData[0] : oddsData;
                        let currentOdds = null;
                        // If the-odds-api returns bookmakers with markets
                        if (Array.isArray(oddsData) && oddsData.length && oddsData[0].bookmakers) {
                            const bm = oddsData[0].bookmakers[0];
                            const market = bm && bm.markets ? bm.markets[0] : null;
                            const outcome = market && market.outcomes ? market.outcomes.find(o => o.name && o.price) : null;
                            if (outcome) currentOdds = parseFloat(outcome.price);
                        }
                        // Fallback: try a direct numeric value if available
                        if (currentOdds === null && book && book.price) currentOdds = parseFloat(book.price);
                        if (currentOdds === null) continue;

                        const previousOdds = STATE.previousOdds.get(matchId) || currentOdds;
                        const oddsChange = ((previousOdds - currentOdds) / previousOdds) * 100;

                        // Pad veći od praga
                        const threshold = parseFloat(Utils.getStorageItem('oddDropThreshold', CONFIG.ODDS_DROP_THRESHOLD)) || CONFIG.ODDS_DROP_THRESHOLD;
                        if (oddsChange > threshold) {
                            STATE.totalOddsDropAlerts++;
                            UI.updateStats();
                            Utils.playSound('danger');
                            Utils.sendNotification('🚨 Kvota Dramski Pala!', { body: `${match.teams.home.name} vs ${match.teams.away.name}\nKvota: ${previousOdds.toFixed(2)} → ${currentOdds.toFixed(2)}\nPad: ${oddsChange.toFixed(1)}%` });
                            UI.showAlert('Pad Kvote', `Kvota pala ${oddsChange.toFixed(1)}% za ${match.teams.home.name} vs ${match.teams.away.name}`, 'danger');
                        }

                        STATE.previousOdds.set(matchId, currentOdds);
                        // save history
                        const hist = STATE.matchOddsHistory.get(matchId) || [];
                        hist.push({ ts: Date.now(), odds: currentOdds });
                        if (hist.length > 200) hist.shift();
                        STATE.matchOddsHistory.set(matchId, hist);
                    } catch (error) { console.error('Error checking odds:', error); }
                }
            },

            checkFavoriteLosing: () => {
                const liveMatches = STATE.matches.filter(m => m.fixture && (m.fixture.status === 'LIVE' || (m.fixture.status && m.fixture.status.toUpperCase().includes('LIVE'))));
                for (const match of liveMatches) {
                    const matchId = match.fixture && match.fixture.id ? match.fixture.id.toString() : (match.id ? match.id.toString() : null);
                    if (!matchId || !STATE.favoriteMatches.has(matchId)) continue;
                    const goals = match.goals || { home: 0, away: 0 };
                    const teams = match.teams || { home:{name:'Home'}, away:{name:'Away'} };
                    if (goals.home < goals.away) {
                        const lastAlert = Utils.getStorageItem(`lastLoseAlert_${matchId}`, 0);
                        const now = Date.now();
                        if (now - lastAlert > 5 * 60 * 1000) {
                            STATE.totalLosingAlerts++;
                            UI.updateStats();
                            Utils.playSound('alert');
                            Utils.sendNotification('⚠️ Favorit Gubi!', { body: `${teams.home.name} vs ${teams.away.name}\nScore: ${goals.home} - ${goals.away}` });
                            UI.showAlert('Favorit Gubi', `${teams.home.name} gubi sa ${goals.home} - ${goals.away}`, 'warning');
                            Utils.setStorageItem(`lastLoseAlert_${matchId}`, now);
                        }
                    }
                    // Poseban alert: nerешено u 75. minutu
                    if ((match.fixture && match.fixture.elapsed >= 75) && (goals.home === goals.away)) {
                        const last75 = Utils.getStorageItem(`last75Alert_${matchId}`, 0);
                        const now = Date.now();
                        if (now - last75 > 60 * 60 * 1000) {
                            Utils.playSound('danger');
                            Utils.sendNotification('⏱️ Nerešeno u 75. minutu', { body: `${teams.home.name} ${goals.home} - ${goals.away} ${teams.away.name}` });
                            UI.showAlert('Nerešeno 75\'', `${teams.home.name} ${goals.home} - ${goals.away} ${teams.away.name}`, 'warning');
                            Utils.setStorageItem(`last75Alert_${matchId}`, now);
                        }
                    }
                }
            },

            checkScheduledOddsAtTimes: () => {
                CONFIG.ODDS_CHECK_TIMES.forEach(time => {
                    if (Utils.isTimeInRange(time)) Monitor.checkOddsDrops();
                });
            },

            startContinuousMonitoring: () => {
                setInterval(() => { Monitor.checkFavoriteLosing(); }, 30 * 1000);
                setInterval(() => { Monitor.checkOddsDrops(); }, CONFIG.ODDS_CHECK_INTERVAL);
                setInterval(() => { Monitor.checkScheduledOddsAtTimes(); }, 60 * 1000);
            },
        };

        // ========================================
        // DATA LOADER
        // ========================================
        const DataLoader = {
            loadAllMatches: async () => {
                const liveMatches = await API.fetchLiveMatches();
                const scheduledMatches = await API.fetchScheduledMatches();
                const finishedMatches = await API.fetchFinishedMatches();
                // combine (avoid duplicates) — simple concat for now
                STATE.matches = [...liveMatches, ...scheduledMatches, ...finishedMatches];
                STATE.lastRefresh = new Date();
                UI.renderMatches();
                UI.updateStats();
            },
        };

        // ========================================
        // EVENTS
        // ========================================
        const Events = {
            init: () => {
                document.getElementById('settingsBtn').addEventListener('click', () => { document.getElementById('settingsModal').classList.add('active'); });
                document.getElementById('closeSettingsBtn').addEventListener('click', () => { document.getElementById('settingsModal').classList.remove('active'); });
                document.getElementById('savSettingsBtn').addEventListener('click', () => { UI.saveSettings(); setTimeout(()=>{ document.getElementById('settingsModal').classList.remove('active'); DataLoader.loadAllMatches(); }, 500); });
                document.getElementById('refreshBtn').addEventListener('click', async () => { const btn = document.getElementById('refreshBtn'); btn.classList.add('loading'); await DataLoader.loadAllMatches(); btn.classList.remove('loading'); });
                document.getElementById('showLiveOnly').addEventListener('change', UI.renderMatches);
                document.getElementById('showFavoritesOnly').addEventListener('change', UI.renderMatches);
                window.addEventListener('click', (e) => { const modal = document.getElementById('settingsModal'); if (e.target === modal) modal.classList.remove('active'); });
                if ('Notification' in window && Notification.permission === 'default*
